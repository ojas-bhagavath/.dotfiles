[mgr]
ratio = [1, 5, 3]
sort_by = "natural"
show_hidden = true

[preview]
tab_size = 4

[opener]
handlr = [{ run = "handlr open %s", desc = "Open with handlr", orphan = true }]

[open]
rules = [
  { url = "*", use = ["handlr", "edit"] },
  { mime = "*", use = ["handlr", "edit"] },
]

[tasks]
image_bound = [10000, 10000]

[input]
cursor_blink = true
